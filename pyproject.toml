[project]
name = "periodic-web-scraper"
version = "0.1.0"
description = "Periodic web scraping with Playwright and SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.41.0",
  "fastapi>=0.110.0",
  "jinja2>=3.1.3",
  "uvicorn>=0.27.1",
]

[project.scripts]
run-scraper = "scraper.app:main"
run-admin = "scraper.admin:main"

[tool.uv]
package = true
